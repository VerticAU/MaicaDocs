name: Publish Docs Site

on:
  push:
    branches: [master]
    paths:
      - 'knowledgebase/**'
      - 'site/**'
  workflow_dispatch:

concurrency:
  group: publish-docs-site-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The transform scripts use only the Node standard library. There are zero
      # npm dependencies and no package-lock.json, so we do NOT enable an npm
      # cache and do NOT run npm ci. setup-node is here only to pin the node
      # binary that build.sh invokes.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: site/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Transform GitBook markdown
        run: ./build.sh

      - name: Build static site
        run: mkdocs build --strict

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"
          terraform_wrapper: false

      - name: Terraform init (read stack outputs)
        working-directory: site/terraform
        run: terraform init -input=false

      - name: Publish to S3 and invalidate CloudFront
        run: ./bin/publish-site.sh
