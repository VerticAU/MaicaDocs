name: Sync Docs to S3

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'knowledgebase/**'
      - 'scripts/kb_metadata.py'
      - 'scripts/test_kb_metadata.py'
      - '.github/workflows/sync-docs-to-s3.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the metadata script
        run: python -m unittest discover -s scripts -p "test_*.py"

      # Live pages and their sidecars only: pages GitBook has retired
      # (frontmatter hidden: true or noIndex: true) are left out, so the
      # --delete sync below removes them from S3 and the next ingestion
      # drops them from the knowledge base.
      - name: Stage live pages and Bedrock metadata files
        run: |
          python scripts/kb_metadata.py --stage build/knowledgebase
          staged=$(find build/knowledgebase -name '*.md' | wc -l)
          echo "staged markdown files: $staged"
          # Guard the --delete sync: a broken stage must never empty the bucket.
          if [ "$staged" -lt 300 ]; then
            echo "::error::only $staged pages staged, refusing to sync"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Sync markdown and metadata to raw S3 bucket
        run: |
          aws s3 sync build/knowledgebase/ s3://${{ secrets.S3_RAW_BUCKET }}/knowledgebase/ \
            --delete \
            --exclude "*" \
            --include "*.md" \
            --include "*.md.metadata.json" \
            --no-progress
